note: >-
  Poptin publishes NO API client SDK in any language registry — npm, PyPI, RubyGems,
  crates.io, NuGet, Maven Central and pkg.go.dev all return nothing first-party. What
  Poptin does ship first-party is a set of CMS/platform INSTALL PLUGINS whose job is to
  inject the hosted embed script (https://cdn.popt.in/pixel.js) into a site. They are
  integration packages, not API client libraries, so no `SDKs` pointer is emitted for
  them — see the currency notes below, most of the estate has not shipped since 2020-2021.
