aid: poptin
name: Poptin
description: >-
  Poptin is an Israeli-founded, no-code conversion and lifecycle marketing platform that
  bundles website popups, bars, embedded forms, coupons, email campaigns, email automation,
  contact management, audience segmentation and website tracking into a single SaaS product
  aimed at ecommerce stores, SaaS companies, agencies and small businesses. Delivery is a
  hosted embed script (cdn.popt.in/pixel.js) installed via first-party plugins for WordPress,
  Magento 2, Craft CMS, SilverStripe, TYPO3, OctoberCMS, Contao, Shopify, Wix and Google Tag
  Manager. Its developer surface is client-side and event-shaped rather than REST: documented
  DOM CustomEvents (poptinView, poptinClose, poptinSubmit, couponCopy) with a published
  event.detail field set, named global callbacks, and an outbound per-popup Webhooks
  integration that posts lead data to a subscriber URL. Poptin publishes no public API
  reference, no OpenAPI, and no developer portal; a Make/Zapier API key is issued from
  account settings for its two automation connectors.
