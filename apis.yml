apis:
- name: Poptin Embed & Events
  description: >-
    Poptin's developer-facing surface. The hosted embed script renders popups, bars,
    sidebars, full-screen and mobile surfaces plus embedded forms into a host page, fires
    documented DOM CustomEvents with a published event.detail field set, and invokes named
    global callbacks. Conversions can be forwarded outbound via the per-poptin Webhooks
    integration. There is no published REST reference and no machine-readable contract; the
    application host does serve an authenticated internal /api/display/* surface used by the
    embed itself, observed returning 401 application/json, but Poptin does not document it.
  humanURL: https://help.poptin.com/en/article/dom-events-how-it-works-1e32jhj/
  baseURL: https://app.popt.in
  tags:
